name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: aoyunyang/spider-king-skill
  UPSTREAM_REF: main

jobs:
  validate-upstream:
    name: Validate upstream candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - name: Check out the fork automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags --prune upstream "${UPSTREAM_REF}"
          upstream_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          [[ "${upstream_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${upstream_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build the candidate and reapply the 83d overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/upstream-sync/sync.py apply \
            --upstream-commit "${{ steps.upstream.outputs.sha }}"
          python3 .github/upstream-sync/sync.py verify \
            --upstream-commit "${{ steps.upstream.outputs.sha }}"

      - name: Create an isolated Python test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/spider-king-test-venv"
          "${RUNNER_TEMP}/spider-king-test-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            'PyYAML==6.0.3' \
            'pytest==9.1.1'
          printf '%s\n' "${RUNNER_TEMP}/spider-king-test-venv/bin" >> "${GITHUB_PATH}"

      - name: Validate the skill and run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          readme_backup="${RUNNER_TEMP}/spider-king-README.md"
          mv README.md "${readme_backup}"
          trap 'mv "${readme_backup}" README.md' EXIT
          python scripts/validate_skill.py .
          mv "${readme_backup}" README.md
          trap - EXIT
          pytest -q -p no:cacheprovider

      - name: Run Node profile tests with global-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/upstream-sync/sync.py inventory > "${RUNNER_TEMP}/node-inventory-before.json"
          export NPM_CONFIG_PREFIX="${RUNNER_TEMP}/npm-global"
          python3 .github/upstream-sync/sync.py install-global-deps
          export NODE_PATH="$(npm root --global)"
          node --test \
            references/profiles/browser-hook-snippets/tests/static-contract.test.js \
            references/profiles/browser-hook-snippets/tests/runtime-contract.test.js
          node --test \
            references/profiles/env-patch/tests/test-env-diagnose.js \
            references/profiles/env-patch/tests/test-runtime-contracts.js
          node --test references/profiles/static-ast/tests/profile.test.js
          python3 .github/upstream-sync/sync.py inventory > "${RUNNER_TEMP}/node-inventory-after.json"
          cmp "${RUNNER_TEMP}/node-inventory-before.json" "${RUNNER_TEMP}/node-inventory-after.json"

  publish:
    name: Publish verified update
    needs: validate-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the current fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Rebuild the verified candidate without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="${{ needs.validate-upstream.outputs.upstream_sha }}"
          [[ "${upstream_sha}" =~ ^[0-9a-f]{40}$ ]]
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${upstream_sha}"
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "${upstream_sha}"
          python3 .github/upstream-sync/sync.py apply --upstream-commit "${upstream_sha}"
          python3 .github/upstream-sync/sync.py verify --upstream-commit "${upstream_sha}"

      - name: Commit and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git -c core.whitespace=cr-at-eol diff --cached --check -- .github
          git -c core.whitespace=cr-at-eol diff --cached --check \
            "${{ needs.validate-upstream.outputs.upstream_sha }}" -- \
            README.md \
            SKILL.md \
            references/anti-patterns-playbook.md \
            references/node-dependency-isolation-playbook.md \
            references/official-self-test-task-suite.md \
            references/profiles/static-ast/index.md \
            scripts/forward_test_report.py \
            scripts/validate_skill.py
          if git diff --cached --quiet; then
            echo "mode=unchanged" >> "${GITHUB_OUTPUT}"
            echo "Already synchronized with upstream."
            exit 0
          fi

          upstream_sha="${{ needs.validate-upstream.outputs.upstream_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync upstream ${upstream_sha:0:12}"

          if git push origin HEAD:main; then
            echo "mode=direct" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sync_branch="automation/upstream-sync"
          git push --force origin "HEAD:refs/heads/${sync_branch}"
          pr_number="$(gh pr list --head "${sync_branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "${sync_branch}" \
              --title "Sync upstream ${upstream_sha:0:12}" \
              --body "Automated upstream sync passed the fork overlay and regression gates. Direct push was unavailable, so this PR preserves branch-protection review.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "${pr_number}" --auto --squash || true
          echo "mode=pull-request" >> "${GITHUB_OUTPUT}"
          echo "pull_request=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Write the run summary
        shell: bash
        run: |
          {
            echo "## Upstream sync"
            echo
            echo "- Upstream: \`${UPSTREAM_REPOSITORY}@${{ needs.validate-upstream.outputs.upstream_sha }}\`"
            echo "- Result: \`${{ steps.publish.outputs.mode }}\`"
            if [[ -n "${{ steps.publish.outputs.pull_request }}" ]]; then
              echo "- Pull request: #${{ steps.publish.outputs.pull_request }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  report:
    name: Report sync health
    if: always()
    needs:
      - validate-upstream
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the sync alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATE_RESULT: ${{ needs.validate-upstream.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream sync needs attention"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"

          if [[ "${VALIDATE_RESULT}" == "success" && "${PUBLISH_RESULT}" == "success" ]]; then
            if [[ -n "${issue_number}" ]]; then
              gh issue comment "${issue_number}" --body "The upstream sync recovered successfully: ${RUN_URL}"
              gh issue close "${issue_number}" --reason completed
            fi
            exit 0
          fi

          body="The GitHub-hosted upstream sync stopped at a safety gate. Validation: ${VALIDATE_RESULT}; publication: ${PUBLISH_RESULT}. Inspect the run before changing the overlay or accepting upstream semantics: ${RUN_URL}"
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
